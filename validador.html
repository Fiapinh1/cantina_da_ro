<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <meta name="description" content="Validador de Token - Cantina da Rô">
  <meta name="theme-color" content="#ff6b35">
  <title>Validador - Cantina da Rô</title>

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icons/icon-180.png">
  <link rel="icon" type="image/png" href="assets/icons/icon-192.png">
  
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <link rel="stylesheet" href="assets/css/validador.css">
</head>
<body>

  <div class="container">
    <!-- BACK BUTTON -->
    <a href="index.html" class="back-btn" title="Voltar">
      <i data-lucide="arrow-left"></i>
    </a>

    <!-- HEADER -->
    <div class="header">
      <h1 class="logo">
        <img src="assets/img/logo.png" alt="Logo Cantina da Rô" class="header-logo">
        Validador Rápido
      </h1>
      <p class="subtitle">Cantina da Rô</p>
    </div>

    <!-- STATS -->
    <div class="stats-grid">
      <div class="stat-card">
        <p class="stat-number" id="statTotal">0</p>
        <p class="stat-label">Total</p>
      </div>
      <div class="stat-card">
        <p class="stat-number" id="statValidated">0</p>
        <p class="stat-label">Entregues</p>
      </div>
      <div class="stat-card">
        <p class="stat-number" id="statPending">0</p>
        <p class="stat-label">Pendentes</p>
      </div>
      <div class="stat-card">
        <p class="stat-number" id="statPaid">0</p>
        <p class="stat-label">Pagos</p>
      </div>
    </div>

    <!-- SEARCH BOX -->
    <div class="search-box">
      <h2 class="search-title">
        <i data-lucide="search"></i>
        Digite o Token
      </h2>
      <div class="input-wrapper">
        <input 
          type="text" 
          class="token-input" 
          id="tokenInput"
          placeholder="0000"
          maxlength="4"
          autocomplete="off"
          autofocus
        >
        <p class="input-hint">Pressione Enter ou clique em Validar</p>
      </div>
      <button class="search-btn" id="searchBtn">
        <i data-lucide="search"></i>
        Buscar e Validar
      </button>
    </div>

    <!-- RESULT -->
    <div class="result" id="result">
      <div class="result-header">
        <div class="result-icon" id="resultIcon">✓</div>
        <h3 class="result-title" id="resultTitle">Pedido Encontrado</h3>
        <p class="result-subtitle" id="resultSubtitle">Detalhes do pedido</p>
      </div>

      <div class="details-grid" id="detailsGrid">
        <!-- Detalhes serão inseridos aqui -->
      </div>

      <div id="paymentWarningBox"></div>

      <div class="action-buttons" id="actionButtons">
        <!-- Botões serão inseridos aqui -->
      </div>
    </div>

    <!-- HISTÓRICO -->
    <div class="history">
      <h3 class="history-title">
        <i data-lucide="clock"></i>
        Últimas Validações
      </h3>
      <div class="history-list" id="historyList">
        <div class="empty-history">
          <i data-lucide="inbox" style="width:48px;height:48px;opacity:.3;margin-bottom:12px;"></i>
          <p>Nenhuma validação ainda</p>
        </div>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/validador.js"></script>

</body>
</html>
